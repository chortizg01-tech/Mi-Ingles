<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- App Rounded Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Inner Ring Glow -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />

  <!-- Central Badge / Card -->
  <g filter="url(#cardShadow)">
    <!-- Decorative Union Jack / Learning Motif Accent -->
    <circle cx="256" cy="180" r="64" fill="#6366f1" fill-opacity="0.4" stroke="#a5b4fc" stroke-width="3" />
    <path d="M256 140L264 168L292 172L270 190L278 218L256 202L234 218L242 190L220 172L248 168Z" fill="#fbbf24" />
    
    <!-- Top Level Subtitle -->
    <text x="256" y="275" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#a5b4fc" text-anchor="middle" letter-spacing="4">A2/B1 ➔ C1</text>
    
    <!-- Main "Inglés" Text Requested by User -->
    <text x="256" y="365" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-1">Inglés</text>
  </g>

  <!-- Small Bottom Accent Pill -->
  <rect x="186" y="405" width="140" height="24" rx="12" fill="#fbbf24" />
  <text x="256" y="421" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1e1b4b" text-anchor="middle" letter-spacing="2">ADAPTIVE APP</text>
</svg>
